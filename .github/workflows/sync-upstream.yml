name: Sync Fork with Upstream

# Runs only inside the lab22-sit fork — a no-op on the canonical repository.
# Note: scheduled workflows are disabled by default on forks; enable them
# once from the fork's Actions tab.
#
# SYNC_PAT runbook (stored as an Actions secret on the fork):
#   fine-grained PAT, owner = lab22-sit, repository = lab22-sit/koi-maestro,
#   permissions = Contents RW + Workflows RW, max expiry ~1 year.
#   If it expires, workflow-file syncs start failing — regenerate the token
#   and update the secret; everything else keeps working via GITHUB_TOKEN.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'lab22-sit/koi-maestro'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Sync fork with upstream
        run: gh api --method POST /repos/${{ github.repository }}/merge-upstream -f branch='main'
        env:
          # GITHUB_TOKEN cannot sync commits that touch .github/workflows/.
          # A fine-grained PAT (Contents: write + Workflows: write on the fork)
          # stored as SYNC_PAT removes that limitation; without it the job
          # falls back to GITHUB_TOKEN and workflow-touching syncs fail
          # visibly — recover via the "Sync fork" button in the fork UI.
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
